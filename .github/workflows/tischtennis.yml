name: Tischtennis Checker

# Prüft auf neue Tischtennis-Ergebnisse

on:
  schedule:
    # Abends stündlich (16:17-23:17 UTC = Spielzeit Wien, deckt MEZ+MESZ ab)
    - cron: '17 16-23 * * *'
    # Tagsüber alle 3h (für Ergebnisse die am nächsten Tag eingetragen werden)
    - cron: '17 2,5,8,11,14 * * *'

  # Manuell auslösbar
  workflow_dispatch:

permissions:
  contents: write

# Nie zwei Läufe gleichzeitig
concurrency:
  group: tischtennis-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Tischtennis-Checker ausführen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tischtennis_checker.py

      - name: Änderungen committen
        # Auch nach einem Fehler: bereits gesendete Spiele sichern, sonst kommen sie doppelt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bekannte_spiele.json
          git diff --staged --quiet || git commit -m "auto: bekannte_spiele.json aktualisiert"
          git push || echo "Push fehlgeschlagen - Cache wird beim nächsten Lauf neu aufgebaut"
