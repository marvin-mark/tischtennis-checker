name: Tischtennis Checker

# Prüft auf neue Tischtennis-Ergebnisse

on:
  schedule:
    # Abends alle 30 Min (16:00-23:59 UTC = Spielzeit Wien, deckt MEZ+MESZ ab)
    - cron: '*/30 16-23 * * *'
    # Tagsüber alle 2h (für Ergebnisse die am nächsten Tag eingetragen werden)
    - cron: '0 0,2,4,6,8,10,12,14 * * *'

  # Manuell auslösbar
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Cache laden
        uses: actions/cache@v4
        with:
          path: bekannte_spiele.json
          key: spiele-v2-${{ github.run_id }}
          restore-keys: |
            spiele-v2-

      - name: Tischtennis-Checker ausführen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tischtennis_checker.py

      - name: Cache speichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: bekannte_spiele.json
          key: spiele-v2-${{ github.run_id }}
