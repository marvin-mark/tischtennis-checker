name: Tischtennis Checker

# Prüft auf neue Tischtennis-Ergebnisse

on:
  schedule:
    # Abends alle 30 Min (16:00-23:59 UTC = Spielzeit Wien, deckt MEZ+MESZ ab)
    - cron: '*/30 16-23 * * *'
    # Tagsüber alle 2h (für Ergebnisse die am nächsten Tag eingetragen werden)
    - cron: '0 0,2,4,6,8,10,12,14 * * *'

  # Manuell auslösbar
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Tischtennis-Checker ausführen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tischtennis_checker.py

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bekannte_spiele.json
          git diff --staged --quiet || git commit -m "auto: bekannte_spiele.json aktualisiert"
          git push || echo "Push fehlgeschlagen - Cache wird beim nächsten Lauf neu aufgebaut"
