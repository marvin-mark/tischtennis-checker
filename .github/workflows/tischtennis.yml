name: Tischtennis Checker

# Leitet Ergebnis-Mails des XTTV-Benachrichtigungsdienstes an Telegram weiter

on:
  schedule:
    # Alle 15 Minuten (liest nur das Gmail-Postfach, nicht die XTTV-Webseite)
    - cron: '*/15 * * * *'

  # Manuell auslösbar
  workflow_dispatch:

permissions:
  contents: read

# Nie zwei Läufe gleichzeitig (sonst doppelte Nachrichten)
concurrency:
  group: tischtennis-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Mails prüfen und an Telegram senden
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python mail_checker.py
